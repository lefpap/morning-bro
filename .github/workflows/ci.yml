name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
          cache: maven
      - run: ./mvnw --batch-mode verify
      # Forced so the whole flow runs and a broken Settings File fails CI, not a morning run.
      - name: Dry Run
        run: java -jar target/morning-bro.jar
        env:
          DRY_RUN: true
          FORCE: true
