spring:
  application:
    name: morning-bro

  # Local secrets (gitignored). Its values override this file; real environment variables override both.
  config:
    import: optional:file:.env[.properties][encoding=utf-8]

  main:
    web-application-type: none
    banner-mode: off

  http:

    clients:
      connect-timeout: 5s
      read-timeout: 10s
      imperative:
        factory: jdk

    serviceclient:
      discord:
        base-url: ${MORNING_BRO_DISCORD_WEBHOOK_URL:}
        redirects: dont-follow
      openmeteo:
        base-url: https://api.open-meteo.com

morning-bro:
  dry-run: ${MORNING_BRO_DRY_RUN:false}
  time-zone: Europe/Athens
  home: Athens
  message:
    morning: "Good Morning — Καλημέρα! ☕"
    friday: "Take it easy Friday! 😎"
    # Open-Meteo's CC BY 4.0 credit, as Discord small text; <...> stops the link preview.
    attribution: "-# Weather data by [Open-Meteo.com](<https://open-meteo.com/>)"
  locations:
    - name: Athens
      country-code: GR
      latitude: 37.98
      longitude: 23.73
    - name: Ikaria
      country-code: GR
      latitude: 37.60
      longitude: 26.17
    - name: Brussels
      country-code: BE
      latitude: 50.85
      longitude: 4.35
    - name: Milan
      country-code: IT
      latitude: 45.46
      longitude: 9.19
