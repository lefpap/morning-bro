spring:
  application:
    name: morning-bro

  main:
    web-application-type: none
    banner-mode: off

  http:

    clients:
      connect-timeout: 5s
      read-timeout: 10s
      imperative:
        factory: jdk

    serviceclient:
      discord:
        base-url: ${MORNING_BRO_DISCORD_WEBHOOK_URL}
        redirects: dont-follow
